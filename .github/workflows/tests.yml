name: Pruebas de las demos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests Net-Gestión Demo
        run: npm test
      - name: Tests automatización de reportes
        working-directory: automatizacion-reportes
        run: npm test
